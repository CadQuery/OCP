name: 'Install micromamba'
runs:
  using: 'composite'
  steps:
    - name: install micromamba (Linux)
      if: ${{ contains(runner.os,'Linux')}}
      shell: bash -l {0}
      run: "bash <(curl -L https://micro.mamba.pm/install.sh)"

    - name: add to path (Linux)
      if: ${{ contains(runner.os,'Linux')}}
      shell: bash -l {0}
      run: echo "PATH=$PATH:$HOME/.local/bin" >> $GITHUB_PATH

    - name: install micromamba (Windows)
      if: ${{ contains(runner.os,'Windows')}}
      shell: powershell
      run: |
        Invoke-Webrequest -URI https://micro.mamba.pm/api/micromamba/win-64/latest -OutFile micromamba.tar.bz2
        tar xf micromamba.tar.bz2
        MKDIR c:/tools/micromamba
        MOVE -Force Library\bin\micromamba.exe c:/tools/micromamba/micromamba.exe

    - name: add to path (Windows + Bash)
      if: ${{ contains(runner.os,'Windows')}}
      shell: bash -l {0}
      run: |
        echo "PATH=$PATH:/c/tools/micromamba" >> $GITHUB_PATH
        ls /c/tools/micromamba

    - name: add to path (Windows + Powershell)
      if: ${{ contains(runner.os,'Windows')}}
      shell: powershell
      run: |
        "c:/tools/micromamba" | Out-File -FilePath "$env:GITHUB_PATH" -Append

    - name: 'Install (MacOS)'
      if: contains(runner.os,'mac')
      shell: bash -l {0}
      run: brew install micromamba

    - name: 'Check installation'
      shell: bash -l {0}
      run: which micromamba && micromamba info

    - name: 'Check installation on Powershell'
      if: ${{ contains(runner.os,'Windows')}}
      shell: powershell
      run: micromamba info
